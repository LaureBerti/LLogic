# JAMER — LLM Ontology Consistency — Hydra config
# Run: python src/main.py [overrides]
# Example: python src/main.py llm.model=deepseek-r1:latest ontology.name=anatomy

llm:
  provider: ollama          # ollama | openai | anthropic
  api_base: http://localhost:11434/v1
  model: llama3.2:latest
  temperature: 0.0          # 0 for reproducibility; 0.7 for self-consistency sampling
  max_tokens: 2048          # 2048 needed for reasoning models (DeepSeek-R1)
  n_samples: 5              # for self-consistency voting
  timeout_s: 120.0          # HTTP timeout per LLM call (seconds); use 600 for ToT on CPU-only VMs

ontology:
  name: book                # book | anatomy | agrovoc | gemet | cso | snomed | mesh
  path: data/ontologies/    # directory; file resolved as <path>/<name>.*

sampling:
  n_concepts: 50
  n_relations: 30
  seed: 42
  stratify_depth: true      # sample ~1/3 leaf, ~1/3 intermediate, ~1/3 root

prompting:
  strategy: zero_shot       # zero_shot | cot | tot | self_consistency
  fol_format: strict        # strict | relaxed — how tightly to enforce FOL syntax

solver:
  endpoint: local           # local (Z3 Python) | remote (formallogic.com API)
  timeout_s: 10             # per-concept solver timeout

metrics:
  embed_model: all-MiniLM-L6-v2   # sentence-transformers model for semantic sim
  ged_method: nx_optimize          # graph edit distance method

output:
  dir: outputs/results
  paper_ready: outputs/paper_ready

phase3:
  use_phase1_context: true  # set false for no-context control experiment

phase: 1          # 0=sample, 1=concepts (FOL+Z3), 2=edges, 3=reconstruct
phase_2b: false   # set true to run Phase 2b (subClassOf transitivity probing)
