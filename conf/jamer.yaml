llm:
  provider: ollama
  api_base: http://localhost:11434/v1
  model: llama3.2:latest
  temperature: 0.0
  max_tokens: 2048
  max_tokens_retry: 8192
  timeout_retry_s: 1800.0
  n_samples: 5
  timeout_s: 120.0
  think: null

ontology:
  name: book
  path: data/ontologies/

sampling:
  n_concepts: 50
  n_relations: 30
  seed: 42
  stratify_depth: true

prompting:
  strategy: zero_shot
  fol_format: strict

solver:
  endpoint: local
  timeout_s: 10

metrics:
  embed_model: all-MiniLM-L6-v2
  ged_method: nx_optimize

output:
  dir: outputs/results
  paper_ready: outputs/paper_ready

phase3:
  use_phase1_context: true
  context_turns: 30

phase: 1
phase_2b: false
