defaults:
- _self_
task: counts
paths:
  results_dir: outputs/results
  phase1_glob: '**/phase1_results.csv'
  phase2_glob: '**/phase2_results.csv'
  phase3_glob: '**/phase3_results.csv'
  out_dir: outputs/analysis
grid:
  ontologies:
  - book
  - anatomy
  - agrovoc
  - cso
  - mesh
  models:
  - llama3.2:latest
  - gemma2:2b
  - mistral:7b
  - qwen2.5:7b
  strategies:
  - zero_shot
  - cot
  - tot
  - self_consistency
stats:
  conf_level: 0.95
injection:
  n_per_kind: 300
  seed: 42
  solver_timeout_s: 5
audit:
  sample_n: 60
  seed: 42
  export_all_failures: true
semantic:
  model_name: all-MiniLM-L6-v2
  samples_dir: data/samples
  results_dirs:
  - outputs/results
  - outputs/results_seed123
  default_seed: 42
  seed_by_dir:
    results: 42
    results_seed123: 123
  dry_run: true
reasoner:
  arm: control
  results_dirs:
  - outputs/results
  - outputs/results_seed123
  arm_ontologies:
    arm_a:
    - ido
    - dbpedia
    arm_b:
    - dbpedia
    control:
    - book
    - anatomy
    - cso
    arm_c:
    - ido
    - dbpedia
  arm_file_override:
    arm_b:
      dbpedia: dbpedia_enriched
    arm_c: {}
  limit: 150
  timeout_s: 60
  ontology_files:
    book: data/ontologies/book.rdf
    anatomy: data/ontologies/anatomy.owl
    cso: data/ontologies/cso.owl
    agrovoc: data/ontologies/agrovoc_core.rdf
    mesh: data/ontologies/mesh.ttl
    ido: data/ontologies/candidates/obo/ido.owl
    envo: data/ontologies/candidates/obo/envo.owl
    dbpedia: data/ontologies/candidates/dbpedia_r4b.nt
    dbpedia_enriched: data/ontologies/candidates/enriched_dbpedia_r4b.nt
stem:
  worksheet: data/audit/audit_worksheet.csv
  older_models:
  - llama3.2:latest
  - gemma2:2b
  - mistral:7b
  - qwen2.5:7b
  prefix_len: 5
  min_word_len: 4
  body_chars: 600
  dry_run_note: set write=true to persist
  write: false
base_tuned:
  api_base: http://localhost:11434
  seed: 42
  ontologies:
  - book
  - anatomy
  - cso
  - agrovoc
  max_tokens: 220
  timeout_s: 300.0
  pairs:
  - family: mistral7b
    base: mistral:7b-text
    tuned: mistral:7b-instruct
  - family: qwen05b
    base: qwen2.5:0.5b-base
    tuned: qwen2.5:0.5b-instruct
  out_csv: outputs/analysis/r1_8_base_vs_tuned.csv
parent_labels:
  seed: 42
  samples_dir: data/samples
  ontologies_dir: data/ontologies
  out_pattern: parent_labels_{ontology}_seed{seed}.json
  builtin_pattern: (owl|rdfs|rdf)#(Thing|Resource|Class)$
  sources:
    anatomy:
      file: anatomy.owl
      format: rdfxml
      base: http://human.owl
    mesh:
      file: mesh.ttl
      format: turtle
      iri_prefix: http://purl.bioontology.org/ontology/MESH/
    agrovoc:
      file: agrovoc_core.rdf
      format: skosxl
      lang: en
  skip:
  - book
  - cso
context_recall:
  results_dir: outputs/results
  seed: 42
  context_turns: 30
  out_json: outputs/analysis/context_recall.json
phase3_recompute:
  results_dirs:
  - outputs/results
  default_seed: 42
  exclude:
  - archive
  semantic: false
  report_json: outputs/analysis/phase3_recompute.json
  write: false
phase3_pr:
  results_dir: outputs/results
  seed: 42
  models:
  - gemma2_2b
  - llama3.2_latest
  - mistral_7b
  - qwen2.5_7b
  out_csv: outputs/analysis/phase3_precision_recall.csv
  write: false
phase3_fullctx:
  published_dir: outputs/results
  fullctx_dir: outputs/results_fullctx
  seed: 42
  models:
  - gemma2_2b
  - llama3.2_latest
  - mistral_7b
  - qwen2.5_7b
  out_json: outputs/analysis/fullctx_comparison.json
  write: false
phase3_untruncate:
  source_dir: outputs/results
  target_dir: outputs/results_untruncated
  report_json: outputs/analysis/phase3_untruncate.json
  api_base: http://localhost:11434
  num_predict: 8192
  num_ctx: 16384
  context_turns: 30
  timeout_s: 7200.0
  only_truncated: true
  limit: 0
  write: false
qwen_budget:
  seeds:
  - 42
  - 123
  - 456
  arm_2048: outputs/results_qwen_budget_2048
  arm_8192: outputs/results_qwen_budget_8192
  out_json: outputs/analysis/qwen_budget_contrast.json
  write: false
